<div class="github-profile">
  <div class="header-width">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z">
            </path>
          </svg>
        </button>
        <svg height="32" viewBox="0 0 16 16" width="32" class="logo">
          <path fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
          </path>
        </svg>
        <!-- <span class="profile-pic-small"></span> -->
        <span class="username">satendracoder</span>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M10.68 11.74a6.5 6.5 0 10-1.06 1.06l3.85 3.85a.75.75 0 001.06-1.06l-3.85-3.85zM11.5 6.5a5 5 0 11-10 0 5 5 0 0110 0z">
            </path>
          </svg>
          <input type="text" placeholder="Type / to search">
        </div>
      </div>
      <div class="header-right">
        <!-- <button class="icon-btn">
          <mat-slide-toggle [(ngModel)]="checked">Toggle</mat-slide-toggle>
        </button> -->

        <button class="icon-btn">
          <div matBadge="4" matBadgeOverlap="false" class="demo-section">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff">
              <path
                d="M440-440h80v-200h-80v200Zm40 120q17 0 28.5-11.5T520-360q0-17-11.5-28.5T480-400q-17 0-28.5 11.5T440-360q0 17 11.5 28.5T480-320ZM160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z" />
            </svg>
          </div>
        </button>

        <button class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" [matMenuTriggerFor]="menu">
            <path
              d="M8 9a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM1.5 9a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm13 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3z">
            </path>
          </svg>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="downloadResume()">
            <mat-icon>arrow_downward</mat-icon>
            <span>Resume Download</span>
          </button>
          <button mat-menu-item (click)="openWebsite()">
            <mat-icon>link</mat-icon>
            <span>Personal Website</span>
          </button>
          <button mat-menu-item (click)="callPhone()">
            <mat-icon>phone</mat-icon>
            <span>+91 8859758708</span>
          </button>
        </mat-menu>
        <div class="profile-pic-small"></div>

      </div>
    </header>
  </div>

  <nav class="nav">
    <div class="nav-container">
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">

        <span class="badge">20+</span>

      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path

          </path>
        </svg>
        Projects
      </a>
      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path
            d="m8.878.392 5.25 3.045c.54.314.872.89.872 1.514v6.098a1.75 1.75 0 0 1-.872 1.514l-5.25 3.045a1.75 1.75 0 0 1-1.756 0l-5.25-3.045A1.75 1.75 0 0 1 1 11.049V4.951c0-.624.332-1.201.872-1.514L7.122.392a1.75 1.75 0 0 1 1.756 0ZM7.875 1.69l-4.63 2.685L8 7.133l4.755-2.758-4.63-2.685a.248.248 0 0 0-.25 0ZM2.5 5.677v5.372c0 .09.047.171.125.216l4.625 2.683V8.432Zm6.25 8.271 4.625-2.683a.25.25 0 0 0 .125-.216V5.677L8.75 8.432Z">
          </path>
        </svg>
        Packages
      </a>

      <a class="nav-item" routerLink="/experience" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path
            d="M6 2a2 2 0 0 0-2 2H2.5A1.5 1.5 0 0 0 1 5.5v7A1.5 1.5 0 0 0 2.5 14h11a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 13.5 4H12a2 2 0 0 0-2-2H6zm0 1h4a1 1 0 0 1 1 1H5a1 1 0 0 1 1-1z" />

      </a>

      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path
            d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z">

        </svg>
        Stars
        <span class="badge">18+</span>

    </div>

  <main class="content">
    <aside class="sidebar">
      <app-profile></app-profile>
    </aside>

    <section class="main-content">
      <router-outlet />
    </section>
  </main>
</div>
